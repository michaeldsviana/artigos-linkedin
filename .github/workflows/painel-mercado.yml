name: Atualiza painel de mercado

on:
  schedule:
    # 13:00 UTC = 10:00 no horário de Brasília (UTC-3)
    - cron: "0 13 * * *"
  workflow_dispatch:        # permite rodar na mão pelo site do GitHub

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Buscar indicadores
        run: python scripts/atualiza_painel.py

      - name: Publicar se houver mudança
        run: |
          if [[ -n "$(git status --porcelain data/mercado.json)" ]]; then
            git config user.name  "AGROMV bot"
            git config user.email "actions@github.com"
            git add data/mercado.json
            git commit -m "Painel de mercado: atualização automática"
            git push
          else
            echo "Nenhuma mudança nos indicadores."
          fi
