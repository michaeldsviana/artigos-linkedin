name: Descobrir API da CONAB

# Investigacao pontual: abre o portal de precos em um navegador real e
# registra as requisicoes de dados que a propria aplicacao dispara.
# Roda apenas quando acionado na mao, em Actions -> Run workflow.

on:
  workflow_dispatch:

jobs:
  investigar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Investigar o portal
        run: python scripts/descobrir_api_conab.py
