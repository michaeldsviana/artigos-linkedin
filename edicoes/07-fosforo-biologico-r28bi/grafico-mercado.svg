<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" width="820" height="392" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="820" height="392" fill="#FFFFFF"/>
<text x="40" y="46" font-size="23" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">O mercado comercial já confirma a tendência</text>
<text x="40" y="72" font-size="14" fill="#5B6773">Vendas de bioinsumos no Brasil, 1º semestre, R$ bilhões</text>
<line x1="40" y1="90" x2="780" y2="90" stroke="#DDE3E9" stroke-width="1"/>
<text x="326" y="168" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">2025 (1º sem.)</text>
<text x="326" y="186" font-size="12" fill="#8A94A0" text-anchor="end">calculado a partir da variação informada</text>
<rect x="340" y="150" width="308.7" height="46" fill="#8A94A0" rx="3"/>
<text x="662.7" y="179" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">R$ 1,66 bi</text>
<text x="326" y="244" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">2026 (1º sem.)</text>
<text x="326" y="262" font-size="12" fill="#8A94A0" text-anchor="end">alta de 9,6% sobre o ano anterior</text>
<rect x="340" y="226" width="338.5" height="46" fill="#3F7A2E" rx="3"/>
<text x="692.5" y="255" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">R$ 1,82 bi</text>
<line x1="40" y1="308" x2="780" y2="308" stroke="#DDE3E9" stroke-width="1"/>
<text x="40" y="326" font-size="10.5" fill="#8A97A3">Fonte: CropLife Brasil, levantamento do 1º semestre de 2026.</text>
<text x="40" y="342" font-size="10.5" fill="#8A97A3">2025 é calculado a partir da variação de 9,6% informada, não um número</text>
<text x="40" y="358" font-size="10.5" fill="#8A97A3">publicado diretamente pela CropLife.</text>
