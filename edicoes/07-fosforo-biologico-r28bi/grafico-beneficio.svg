<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" width="820" height="392" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="820" height="392" fill="#FFFFFF"/>
<text x="40" y="46" font-size="23" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">O que a solubilização biológica pode valer</text>
<text x="40" y="72" font-size="14" fill="#5B6773">Benefício potencial por safra, em escala nacional, R$ bilhões</text>
<line x1="40" y1="90" x2="780" y2="90" stroke="#DDE3E9" stroke-width="1"/>
<text x="326" y="168" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">Receita adicional</text>
<text x="326" y="186" font-size="12" fill="#8A94A0" text-anchor="end">ganho médio de produtividade de 8,6%</text>
<rect x="340" y="150" width="338.5" height="46" fill="#3F7A2E" rx="3"/>
<text x="692.5" y="179" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">R$ 28,5 bi</text>
<text x="326" y="244" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">Economia em fertilizante</text>
<text x="326" y="262" font-size="12" fill="#8A94A0" text-anchor="end">menos fosfatado sem perder desempenho</text>
<rect x="340" y="226" width="186.5" height="46" fill="#1E6FA8" rx="3"/>
<text x="540.5" y="255" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">R$ 15,7 bi</text>
<line x1="40" y1="308" x2="780" y2="308" stroke="#DDE3E9" stroke-width="1"/>
<text x="40" y="326" font-size="10.5" fill="#8A97A3">Fonte: Embrapa, Ipea e Ministério da Gestão, Revista de Política Agrícola, 03/10/2026.</text>
<text x="40" y="342" font-size="10.5" fill="#8A97A3">Cenário de adoção em escala nacional; somados, os valores superam R$ 44 bilhões por safra.</text>
<text x="40" y="358" font-size="10.5" fill="#8A97A3">Não é resultado já obtido pelo conjunto dos produtores.</text>
</svg>