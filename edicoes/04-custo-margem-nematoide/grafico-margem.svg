<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 452" width="820" height="452" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="820" height="430" fill="#FFFFFF"/>

  <text x="40" y="42" font-size="20" font-weight="700" fill="#12314F">Margem e perda, na mesma unidade</text>
  <text x="40" y="66" font-size="13.5" fill="#5A6B7B">Soja em Mato Grosso, safra 2026/27. Valores em sacas por hectare.</text>

  <line x1="40" y1="84" x2="780" y2="84" stroke="#E2E7EC" stroke-width="1"/>

  <!-- eixo -->
  <g font-size="11" fill="#8A97A3">
    <line x1="300" y1="110" x2="300" y2="352" stroke="#E2E7EC" stroke-width="1"/>
    <line x1="383" y1="110" x2="383" y2="352" stroke="#F0F3F6" stroke-width="1"/>
    <line x1="467" y1="110" x2="467" y2="352" stroke="#F0F3F6" stroke-width="1"/>
    <line x1="550" y1="110" x2="550" y2="352" stroke="#F0F3F6" stroke-width="1"/>
    <line x1="633" y1="110" x2="633" y2="352" stroke="#F0F3F6" stroke-width="1"/>
    <line x1="717" y1="110" x2="717" y2="352" stroke="#F0F3F6" stroke-width="1"/>
    <text x="300" y="370" text-anchor="middle">0</text>
    <text x="383" y="370" text-anchor="middle">5</text>
    <text x="467" y="370" text-anchor="middle">10</text>
    <text x="550" y="370" text-anchor="middle">15</text>
    <text x="633" y="370" text-anchor="middle">20</text>
    <text x="717" y="370" text-anchor="middle">25</text>
  </g>

  <!-- barra 1: folga sobre o COT -->
  <rect x="300" y="118" width="39" height="34" fill="#12314F"/>
  <text x="288" y="134" text-anchor="end" font-size="13" font-weight="600" fill="#12314F">Folga sobre o COT</text>
  <text x="288" y="150" text-anchor="end" font-size="11" fill="#8A97A3">Imea, preço de julho/26</text>
  <text x="349" y="141" font-size="13" font-weight="700" fill="#12314F">2,33</text>

  <!-- barra 2: EBITDA -->
  <rect x="300" y="176" width="160" height="34" fill="#2E7D4F"/>
  <text x="288" y="192" text-anchor="end" font-size="13" font-weight="600" fill="#12314F">EBITDA projetado</text>
  <text x="288" y="208" text-anchor="end" font-size="11" fill="#8A97A3">Imea/Senar-MT, CPA 09/09/26</text>
  <text x="470" y="199" font-size="13" font-weight="700" fill="#2E7D4F">9,62</text>

  <!-- barra 3: perda media -->
  <rect x="300" y="234" width="200" height="34" fill="#B03A2E"/>
  <text x="288" y="250" text-anchor="end" font-size="13" font-weight="600" fill="#12314F">Perda média em área infestada</text>
  <text x="288" y="266" text-anchor="end" font-size="11" fill="#8A97A3">Embrapa, Vera/MT, safra 2011/12</text>
  <text x="510" y="257" font-size="13" font-weight="700" fill="#B03A2E">12,00</text>

  <!-- barra 4: perda maxima -->
  <rect x="300" y="292" width="467" height="34" fill="#B03A2E" opacity="0.35"/>
  <text x="288" y="308" text-anchor="end" font-size="13" font-weight="600" fill="#12314F">Perda máxima medida</text>
  <text x="288" y="324" text-anchor="end" font-size="11" fill="#8A97A3">Embrapa, Vera/MT, safra 2011/12</text>
  <text x="700" y="315" font-size="13" font-weight="700" fill="#FFFFFF">28,00</text>

  <line x1="40" y1="388" x2="780" y2="388" stroke="#E2E7EC" stroke-width="1"/>
  <text x="40" y="408" font-size="10.5" fill="#8A97A3">Fontes: Imea/Senar-MT, Projeto CPA-MT, 09/09/2026. Franchini et al., Embrapa, 2014.</text><text x="40" y="424" font-size="10.5" fill="#8A97A3">Conversão para saca ao preço médio negociado de R$ 111,17 (Imea, julho/2026).</text>
</svg>
