<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" width="820" height="392" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="820" height="392" fill="#FFFFFF"/>
<text x="40" y="46" font-size="23" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">O biológico já é rotina no algodão auditado</text>
<text x="40" y="72" font-size="14" fill="#5B6773">Fazendas de algodão no programa Algodão Brasileiro Responsável (ABR)</text>
<line x1="40" y1="90" x2="780" y2="90" stroke="#DDE3E9" stroke-width="1"/>
<text x="326" y="168" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">Participam do ABR</text>
<text x="326" y="186" font-size="12" fill="#8A94A0" text-anchor="end">sobre o total de fazendas de algodão do país</text>
<rect x="340" y="150" width="347.9" height="46" fill="#1E6FA8" rx="3"/>
<text x="701.9" y="179" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">78%</text>
<text x="326" y="244" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">Usaram biológico no último ano</text>
<text x="326" y="262" font-size="12" fill="#8A94A0" text-anchor="end">entre as fazendas participantes do ABR</text>
<rect x="340" y="226" width="372.9" height="46" fill="#3F7A2E" rx="3"/>
<text x="726.9" y="255" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">83,6%</text>
<line x1="40" y1="308" x2="780" y2="308" stroke="#DDE3E9" stroke-width="1"/>
<text x="40" y="326" font-size="10.5" fill="#8A97A3">Fonte: Abrapa, programa Algodão Brasileiro Responsável, apresentado em 27/04/2026.</text>
<text x="40" y="342" font-size="10.5" fill="#8A97A3">Os dois percentuais vêm da mesma pesquisa e não são cumulativos entre si.</text>
</svg>