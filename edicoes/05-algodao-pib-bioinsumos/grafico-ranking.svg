<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 468" width="820" height="468" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="820" height="468" fill="#FFFFFF"/>
<text x="40" y="46" font-size="23" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">Quem lidera o valor da produção agrícola</text>
<text x="40" y="72" font-size="14" fill="#5B6773">Municípios brasileiros, valor da produção agrícola 2025, em R$ bilhões</text>
<line x1="40" y1="90" x2="780" y2="90" stroke="#DDE3E9" stroke-width="1"/>
<text x="326" y="168" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">Sapezal (MT)</text>
<text x="326" y="186" font-size="12" fill="#8A94A0" text-anchor="end">60% da produção é algodão</text>
<rect x="340" y="150" width="360.7" height="46" fill="#1E6FA8" rx="3"/>
<text x="714.7" y="179" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">R$ 8,59 bi</text>
<text x="326" y="244" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">São Desidério (BA)</text>
<text x="326" y="262" font-size="12" fill="#8A94A0" text-anchor="end">algodão puxou alta de 23,7%</text>
<rect x="340" y="226" width="345.1" height="46" fill="#3F7A2E" rx="3"/>
<text x="699.1" y="255" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">R$ 8,22 bi</text>
<text x="326" y="320" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">Sorriso (MT)</text>
<text x="326" y="338" font-size="12" fill="#8A94A0" text-anchor="end">perdeu área para novo município</text>
<rect x="340" y="302" width="342.6" height="46" fill="#8A94A0" rx="3"/>
<text x="696.6" y="331" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">R$ 8,16 bi</text>
<line x1="40" y1="384" x2="780" y2="384" stroke="#DDE3E9" stroke-width="1"/>
<text x="40" y="402" font-size="10.5" fill="#8A97A3">Fonte: IBGE, Produção Agrícola Municipal (PAM) 2025, divulgada em 17/09/2026.</text>
<text x="40" y="418" font-size="10.5" fill="#8A97A3">Valor da produção agrícola a preços correntes do ano.</text>
</svg>