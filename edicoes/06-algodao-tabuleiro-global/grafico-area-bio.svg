<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" width="820" height="392" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="820" height="392" fill="#FFFFFF"/>
<text x="40" y="46" font-size="23" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">A área tratada com biológico deu um salto</text>
<text x="40" y="72" font-size="14" fill="#5B6773">Hectares tratados com bioinsumos no Brasil, em milhões de ha</text>
<line x1="40" y1="90" x2="780" y2="90" stroke="#DDE3E9" stroke-width="1"/>
<text x="326" y="168" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">2024</text>
<text x="326" y="186" font-size="12" fill="#8A94A0" text-anchor="end">base do ano anterior</text>
<rect x="340" y="150" width="248.2" height="46" fill="#8A94A0" rx="3"/>
<text x="602.2" y="179" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">151 mi ha</text>
<text x="326" y="244" font-size="16" font-weight="700" fill="#0E2338" text-anchor="end" font-family="Archivo, Arial, sans-serif">2025</text>
<text x="326" y="262" font-size="12" fill="#8A94A0" text-anchor="end">alta de 28% em um ano</text>
<rect x="340" y="226" width="318.8" height="46" fill="#3F7A2E" rx="3"/>
<text x="672.8" y="255" font-size="18" font-weight="700" fill="#0E2338" font-family="Archivo, Arial, sans-serif">194 mi ha</text>
<line x1="40" y1="308" x2="780" y2="308" stroke="#DDE3E9" stroke-width="1"/>
<text x="40" y="326" font-size="10.5" fill="#8A97A3">Fonte: CropLife Brasil, dados apresentados no 15º Congresso Brasileiro do Algodão, 23/09/2026.</text>
